
name: Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download software
        env:
          APP_URL: ${{ secrets.APP }}
        run: |
          curl -fsSL "$APP_URL" -o app.zip
          unzip -o app.zip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start updater
        run: |
          python useragents.py

      - name: Commit and push changes
        run: |
          git config user.email "git-hyperbeats@proton.me"
          git config user.name "${{ secrets.GIT_NAME }}"

          git add -A -- \
            useragents-desktop.txt \
            useragents-android.txt \
            useragents-ios.txt \
            useragents-macos.txt \
            useragents-linux.txt

          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "Updated Users-Agents 💡 ($(date '+%F %H:%M %Z'))"
            git push origin HEAD:main
          fi
